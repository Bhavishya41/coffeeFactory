<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Project | Bauhaus Coffee</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <style>
        /* --- DESIGN TOKENS (MATCHING INDEX.HTML) --- */
        :root {
            --c-red: #ff4d4d;
            --c-yellow: #ffcf25;
            --c-blue: #3a86ff;
            --c-black: #1a1a1a;
            --c-white: #fcfbf7;
            
            --border-thick: 3px solid var(--c-black);
            --shadow-hard: 8px 8px 0px var(--c-black);
            --shadow-soft: 4px 4px 0px var(--c-black);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--c-yellow);
            background-image: radial-gradient(var(--c-black) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--c-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- CONTAINER --- */
        .container {
            background: var(--c-white);
            border: var(--border-thick);
            box-shadow: var(--shadow-hard);
            width: 100%;
            max-width: 500px;
            padding: 0;
            position: relative;
        }

        /* HEADER */
        .header {
            background: var(--c-black);
            color: var(--c-white);
            padding: 1.5rem;
            text-align: center;
            border-bottom: var(--border-thick);
        }
        .header h1 {
            text-transform: uppercase;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -1px;
        }
        .header span { color: var(--c-red); }

        /* CONTENT */
        .content {
            padding: 2rem;
        }

        /* FORM ELEMENTS */
        .input-group { margin-bottom: 1.5rem; }
        
        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .shape-dot {
            width: 12px; height: 12px; background: var(--c-blue);
            border: 1px solid black; border-radius: 50%;
        }

        input {
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 1.1rem;
            border: 3px solid var(--c-black);
            background: #f0f0f0;
            transition: 0.2s;
        }
        input:focus {
            background: white;
            outline: none;
            border-color: var(--c-blue);
            box-shadow: 4px 4px 0 rgba(58, 134, 255, 0.2);
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 18px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: 3px solid var(--c-black);
            font-size: 1rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 !important; }

        .btn-connect {
            background: var(--c-white);
            color: var(--c-black);
            box-shadow: var(--shadow-soft);
            margin-bottom: 10px;
        }
        .btn-connect:hover { background: #eee; box-shadow: 6px 6px 0 var(--c-black); }

        .btn-deploy {
            background: var(--c-red);
            color: white;
            box-shadow: var(--shadow-soft);
            font-size: 1.2rem;
        }
        .btn-deploy:hover { background: #ff3333; box-shadow: 6px 6px 0 var(--c-black); }
        .btn-deploy:disabled { background: #888; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: var(--c-black);
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
        }
        .btn-back:hover { border-bottom-color: var(--c-black); }

        /* TERMINAL LOG */
        .terminal {
            background: var(--c-black);
            color: #00ff00;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.8rem;
            border-top: var(--border-thick);
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            display: none; /* Hidden by default */
        }
        .terminal.active { display: block; }
        .log-line { margin-bottom: 5px; }
        .log-line.error { color: #ff4d4d; }
        .log-line.success { color: var(--c-yellow); }

        /* DECORATION */
        .deco-bar {
            height: 10px;
            background: repeating-linear-gradient(
                45deg,
                var(--c-blue),
                var(--c-blue) 10px,
                var(--c-white) 10px,
                var(--c-white) 20px
            );
            border-bottom: var(--border-thick);
        }

        .loader {
            display: inline-block;
            width: 15px; height: 15px;
            border: 3px solid var(--c-white);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Start<span>Project</span></h1>
        </div>
        <div class="deco-bar"></div>

        <div class="content">
            <button id="connectBtn" class="btn btn-connect">Connect Wallet</button>

            <div id="deploySection" style="display: none;">
                <div class="input-group">
                    <label class="label"><div class="shape-dot"></div> Project Name</label>
                    <input type="text" id="contractName" placeholder="e.g. Satoshi's Cafe">
                </div>
                
                <button id="deployBtn" class="btn btn-deploy">LAUNCH CONTRACT</button>
            </div>

            <div id="terminal" class="terminal"></div>

            <a href="index.html" class="btn-back">← Back to Directory</a>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const FACTORY_ADDRESS = "0xE992790cCe6cA04dc5CeD8E2E69C5a26B92d4a13";
        const FACTORY_ABI = [
            "function createCoffeeContract(string memory name) external",
            "event coffeeContractDeployed(address indexed artist, address indexed contractAddress)",
            "error alreadyDeployed()"
        ];

        // --- STATE ---
        let provider, signer, factoryContract;

        // --- UI REFS ---
        const els = {
            connectBtn: document.getElementById('connectBtn'),
            deploySection: document.getElementById('deploySection'),
            deployBtn: document.getElementById('deployBtn'),
            nameInput: document.getElementById('contractName'),
            terminal: document.getElementById('terminal')
        };

        // --- UTILS ---
        function log(msg, type = 'normal') {
            els.terminal.classList.add('active');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const time = new Date().toLocaleTimeString().split(' ')[0];
            line.innerHTML = `[${time}] > ${msg}`;
            els.terminal.appendChild(line);
            els.terminal.scrollTop = els.terminal.scrollHeight;
        }

        // --- LOGIC ---
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert("Please install MetaMask!");
                return;
            }
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                
                const addr = await signer.getAddress();
                
                // Update UI
                els.connectBtn.innerText = `CONNECTED: ${addr.slice(0,6)}...`;
                els.connectBtn.disabled = true;
                els.connectBtn.style.background = "#e0e0e0";
                els.deploySection.style.display = "block";
                
                factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                log("Wallet connected.");
            } catch (e) {
                console.error(e);
            }
        }

        async function deployContract() {
            const name = els.nameInput.value;
            if (!name) {
                log("Error: Project Name is required.", "error");
                return;
            }

            try {
                els.deployBtn.disabled = true;
                els.deployBtn.innerHTML = '<div class="loader"></div> DEPLOYING...';
                
                log("Initiating transaction...");

                const tx = await factoryContract.createCoffeeContract(name);
                log(`Tx Sent: ${tx.hash.slice(0,10)}...`);
                log("Waiting for block confirmation...");

                const receipt = await tx.wait();

                // Parse Event to get new address
                let newAddr = "Unknown";
                for (const logObj of receipt.logs) {
                    try {
                        const parsed = factoryContract.interface.parseLog(logObj);
                        if (parsed.name === 'coffeeContractDeployed') {
                            newAddr = parsed.args[1];
                        }
                    } catch (e) {}
                }

                log("DEPLOYMENT SUCCESSFUL!", "success");
                log(`Contract Address: ${newAddr}`, "success");
                
                // Change button to success state
                els.deployBtn.innerText = "LAUNCHED!";
                els.deployBtn.style.background = "#4CAF50"; // Green
                
                // Redirect hint
                setTimeout(() => {
                    log("You can now return to the directory.");
                }, 1000);

            } catch (error) {
                console.error(error);
                els.deployBtn.disabled = false;
                els.deployBtn.innerText = "LAUNCH CONTRACT";
                
                if (error.message.includes("alreadyDeployed") || (error.data && error.data.includes("alreadyDeployed"))) {
                    log("FAIL: You already have a contract!", "error");
                } else {
                    log("Transaction Failed.", "error");
                }
            }
        }

        // Listeners
        els.connectBtn.addEventListener('click', connectWallet);
        els.deployBtn.addEventListener('click', deployContract);

    </script>
</body>
</html>
